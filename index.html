<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogPulse - Enterprise MEAL & Formative Research Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .app-view { display: none; }
        .app-view.active { display: flex; flex-direction: column; flex-grow: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col" x-data="logpulseApp()">

    <header class="bg-slate-900 text-white shadow-sm border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-base tracking-wider shadow">LP</div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight">LogPulse <span class="text-[10px] px-1.5 py-0.5 bg-indigo-900 text-indigo-200 rounded ml-1 font-normal">Formative Research & MEAL</span></h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs overflow-x-auto">
                <button @click="switchTab('dashboard')" :class="activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">Dashboard</button>
                <button @click="switchTab('formative')" :class="activeTab === 'formative' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">🔬 Formative Proposal & Smart Match</button>
                <button @click="switchTab('builder')" :class="activeTab === 'builder' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">1. Logframe Builder</button>
                <button @click="switchTab('tools')" :class="activeTab === 'tools' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">2. Tool Design</button>
                <button @click="switchTab('pipeline')" :class="activeTab === 'pipeline' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">3. Data Pipeline</button>
                <button @click="switchTab('analysis')" :class="activeTab === 'analysis' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'" class="px-3 py-1.5 rounded-md font-medium transition">4. Analysis & Learning</button>
            </div>

            <div class="flex items-center space-x-3 text-xs">
                <span class="text-slate-400">User: <strong class="text-slate-200" x-text="userEmail">director@cobaltmetrics.com</strong></span>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow flex gap-6">

        <aside class="w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col shrink-0 h-[84vh] sticky top-20">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Project Archives</h2>
                <button @click="openNewProjectModal()" class="text-indigo-600 hover:text-indigo-800 font-bold text-xs" title="New Project">+</button>
            </div>
            
            <div class="space-y-1.5 overflow-y-auto flex-grow pr-1">
                <template x-for="p in projects" :key="p.id">
                    <div @click="selectProject(p)" :class="p.name === currentProjectName ? 'border-indigo-500 bg-indigo-50/50' : 'border-slate-200 hover:bg-slate-50'" class="p-2.5 rounded-lg border cursor-pointer transition flex justify-between items-center group">
                        <div class="flex-grow">
                            <p class="text-xs font-bold" :class="p.name === currentProjectName ? 'text-indigo-900' : 'text-slate-700'" x-text="p.name"></p>
                            <span class="text-[10px] text-slate-400" x-text="p.status + ' • Sectors: ' + p.sectors.join(', ')"></span>
                        </div>
                        <button @click.stop="deleteProject(p.id)" class="text-slate-400 hover:text-rose-600 p-1 rounded opacity-60 group-hover:opacity-100" title="Delete">🗑️</button>
                    </div>
                </template>
                <template x-if="projects.length === 0">
                    <div class="p-3 text-center text-slate-400 text-xs">No projects created yet. Click '+' to add one.</div>
                </template>
            </div>

            <div class="pt-3 border-t border-slate-100 mt-2">
                <button @click="openNewProjectModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs py-2 rounded-lg transition cursor-pointer">
                    + New Project Logframe
                </button>
            </div>
        </aside>

        <main class="flex-grow flex flex-col">

            <div x-show="activeTab === 'dashboard'" class="app-view" :class="activeTab === 'dashboard' ? 'active' : ''">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-400 uppercase">Active Project Archive</p>
                        <h3 class="text-lg font-bold text-slate-800 mt-
